<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>

    <form id="survey-form">
        <fieldset>
            <legend>Personal Information</legend>
            <label id="name-label" for="name">Name </label>
            <input required id="name" type="text" name="name" placeholder=" Eg.: Davi Jones">
            <label id="email-label" for="email">Email</label>
            <input type="email" required id="email" name="email" placeholder="davi@gmail.com">
            <label id="number-label" for="number">Age(optional)</label>
            <input type="number" id="number" min="5" max="100" placeholder="up/down" name="age">
        </fieldset>

        <fieldset>
            <legend>Professioal Information</legend>
            <label for="role">Which option best describes your role?</label>
            <select id="dropdown" name="role">
                <option value="select-current-role" disabled>Select current role</option>
                <option value="student">Student</option>
                <option value="full-time-job">Full time job</option>
                <option value="full-time-learner">Full time learner</option>
                <option value="prefer-not-say">Prefer not to say</option>
                <option value="other">Other</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Would you recommend freeCodeCamp to a friend?</legend>
            <input type="radio" name="recommend" id="definitely" value="definitely">
            <label for="definitely">Definitely</label>
            <input type="radio" name="recommend" id="maybe" value="maybe">
            <label for="maybe">Maybe</label>
            <input type="radio" name="recommend" id="negative" value="negative">
            <label for="negative">Negative</label>
        </fieldset>

        <fieldset>
            <legend>What would you like to see improved?(Check all that apply)</legend>
            <input type="checkbox" id="front-end" value="front-end" name="improve">
            <label for="front-end">Front-end Projects</label>
            <input type="checkbox" id="back-end" value="back-end" name="improve">
            <label for="back-end">Back-end Projects</label>
            <input type="checkbox" id="data-visualization" value="data-visualization" name="improve">
            <label for="data-visualization">Data-visualization</label>
            <input type="checkbox" id="challenges" value="challenges" name="improve">
            <label for="challenges">Challenges</label>
            <input type="checkbox" id="open-source" value="open-source" name="improve">
            <label for="open-source">Open-source Community</label>
            <input type="checkbox" id="videos" value="videos" name="improve">
            <label for="videos">Videos</label>

        </fieldset>

        <label for="comments">Any comments or suggestions?</label>
        <textarea id="comments" name="comments"></textarea>

        <button id="submit" type="submit">Submit</button>
    </form>
  </body>
</html>

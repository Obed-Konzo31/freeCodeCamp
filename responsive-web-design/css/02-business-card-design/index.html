<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="business-card">
        <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="A pink flower">
        <p class="full-name">Marlene Manuel</p>
        <p class="designation">Founder</p>
        <p class="company">@MM Cosmetics</p>
        <hr>
        <p>Email: mm@email.com</p>
        <p>Phone: 123456789</p>
        <a class="portfolio-link" href="https://www.youtube.com/">Portfolio</a>
        <hr>
        
        <div class="social-media">
            <h2>Connect with me</h2>
            <a href="https://x.com">Twitter</a>
            <a href="https://linkedin.com">LinkedIn</a>
            <a href="https://github.com">GitHub</a>
        </div>
    </div>

    
</body>
</html>

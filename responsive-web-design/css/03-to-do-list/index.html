<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="todo-card">

        <h1>My To-Do List</h1>

        <ul class="todo-list">
            <li class="list-item">
                <input type="checkbox" id="first">
                <label for="first">Explore gaming Keyboards</label>
                <ul class="sub-item">
                    <li>
                        <a href="" class="sub-item-link" target="_blank">Store link</a>
                    </li>
                </ul>
            </li>
            <li class="list-item">
                <input type="checkbox" id="second">
                <label for="second">Finish the report</label>
                <ul class="sub-item">
                    <li>
                        <a href="" class="sub-item-link" target="_blank">Request Access</a>
                    </li>
                </ul>
            </li>
            <li class="list-item">
                <input type="checkbox" id="third">
                <label for="third">View Phone's Warranty</label>
                <ul class="sub-item">
                    <li>
                        <a href="" class="sub-item-link" target="_blank">View Receipts</a>
                    </li>
                </ul>
            </li>
            <li class="list-item">
                <input type="checkbox" id="fourth">
                <label for="fourth">Check Processor Specs</label>
                <ul class="sub-item">
                    <li>
                        <a href="" class="sub-item-link" target="_blank">View Model Number</a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</body>

</html>
